name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Syntax check
        run: |
          for f in electron/*.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: Gateway boot check
        run: node test/boot.js
