name: Release

# Builds native installers for Windows, macOS, and Linux and attaches them to a
# GitHub Release. Each OS builds on its own runner so the bundled Node binary
# (staged by scripts/stage-node.js) matches the target platform.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
          # macOS is split by architecture on purpose. stage-node.js fetches the
          # right Node for the target arch either way, but better-sqlite3 is
          # compiled for the *build host* — so building x64 on an arm64 runner
          # ships a mismatched native module and the engine silently falls back
          # to its slower WASM store. macos-13 is the last Intel runner image.
          - os: macos-13
            build: npx electron-builder --mac dmg --x64
          - os: macos-latest
            build: npx electron-builder --mac dmg --arm64
          - os: ubuntu-latest
            build: npm run dist:linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify setup
        run: npm run doctor

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build }}

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false
